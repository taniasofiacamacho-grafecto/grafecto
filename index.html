<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>GRAFECTO — Organic Hair Science</title>

  <meta name="theme-color" content="#4d2f40" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GRAFECTO" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/componentes.css" />
</head>
<body>
  <div id="app">
    <header class="encabezado">
      <div class="encabezado__marca">GRAFECTO</div>
      <div class="encabezado__subtitulo">Organic Hair Science</div>
    </header>

    <div class="buscador">
      <input
        id="buscador-input"
        type="search"
        placeholder="Buscar clienta por nombre…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
      />
    </div>

    <main class="contenido">
      <div id="lista-clientas" class="lista-clientas"></div>
    </main>

    <div class="contenedor-flotante">
      <button id="boton-agregar" class="boton-flotante" aria-label="Agregar clienta">+</button>
    </div>
  </div>

  <!-- Hoja modal: alta / edición de clienta -->
  <div id="fondo-hoja" class="fondo-hoja">
    <div class="hoja">
      <div class="hoja__manija"></div>
      <div class="hoja__titulo" id="hoja-titulo">Nueva clienta</div>

      <form id="formulario-clienta">
        <div class="campo">
          <label for="campo-nombre">Nombre *</label>
          <input id="campo-nombre" type="text" autocapitalize="words" required />
        </div>

        <div class="campo">
          <label for="campo-telefono">Teléfono</label>
          <input id="campo-telefono" type="tel" placeholder="55 1234 5678" />
        </div>

        <div class="campo">
          <label for="campo-notas">Notas generales</label>
          <textarea id="campo-notas" placeholder="Preferencias, alergias, historial general…"></textarea>
        </div>

        <div class="fila-botones">
          <button type="button" id="boton-cerrar-hoja" class="boton boton--secundario">Cancelar</button>
          <button type="submit" class="boton boton--primario">Guardar</button>
        </div>

        <button type="button" id="boton-eliminar" class="boton boton--peligro boton--ancho-completo" hidden style="margin-top: 8px;">
          Eliminar clienta
        </button>
      </form>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/clientas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
